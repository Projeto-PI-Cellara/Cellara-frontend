<!doctype html>
<html>
  <head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <h1>Graphics</h1>
    <div style="display: flex">
      <div style="width: 50%">
        <canvas id="valorIrradiancia"></canvas>
      </div>
      <div style="width: 50%">
        <canvas id="valorPotenciaEstimada"></canvas>
      </div>
    </div>

    <script>
      const irradiancia = new Chart(
        document.getElementById("valorIrradiancia").getContext("2d"),
        {
          type: "line",
          data: {
            datasets: [
              {
                label: "Irradiância",
                borderColor: "#63B1BC",
                backgroundColor: "#ED145B",
              },
            ],
          },
          options: {
            scales: {
              x: {
                beginAtZero: true,
              },
              y: {
                title: {
                  display: true,
                  text: "(%)",
                },
                beginAtZero: true,
              },
            },
          },
        },
      );

      const potenciaEstimada = new Chart(
        document.getElementById("valorPotenciaEstimada").getContext("2d"),
        {
          type: "line",
          data: {
            datasets: [
              {
                label: "Potência Estimada",
                borderColor: "#63B1BC",
                backgroundColor: "#ED145B",
              },
            ],
          },
          options: {
            scales: {
              x: {
                beginAtZero: true,
              },
              y: {
                title: {
                  display: true,
                  text: "(%)",
                },
                beginAtZero: true,
              },
            },
          },
        },
      );

      let paginacao = {};
      let tempo = {};

      function obterDados(grafico, endpoint) {
        fetch("http://localhost:3300/valor/" + endpoint)
          .then((response) => response.json())
          .then((valores) => {
            if (paginacao[endpoint] == null) {
              paginacao[endpoint] = 0;
            }
            if (tempo[endpoint] == null) {
              tempo[endpoint] = 0;
            }

            const ultimaPaginacao = paginacao[endpoint];
            paginacao[endpoint] = valores.length;
            valores = valores.slice(ultimaPaginacao);

            valores.forEach((valor) => {
              if (
                grafico.data.labels.length == 10 &&
                grafico.data.datasets[0].data.length == 10
              ) {
                grafico.data.labels.shift();
                grafico.data.datasets[0].data.shift();
              }

              grafico.data.labels.push(tempo[endpoint]++);
              grafico.data.datasets[0].data.push(parseFloat(valor));
              grafico.update();
            });
          })
          .catch((error) => console.error("Erro ao obter dados:", error));
      }

      setInterval(() => {
        obterDados(irradiancia, "irradiancia");
        obterDados(potenciaEstimada, "potencia_estimada");
      }, 2000);
    </script>
  </body>
</html>
